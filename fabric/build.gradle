// Adjust the output jar name here
base {
    archivesName = "${mod_id}-api"
}

dependencies {
    // NeoForge API. Split into two to fix runClient
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_api}"
    modApi "net.fabricmc.fabric-api:fabric-api:${project.fabric_api}"

    // Do not remove or edit!
    implementation(project(":common"))
}

/**
 * ===============================================================================
 * =       DO NOT EDIT BELOW THIS LINE UNLESS YOU KNOW WHAT YOU ARE DOING        =
 * ===============================================================================
 */

unimined.minecraft {
    combineWith(project(":common").sourceSets.withoutFMJ)

    fabric {
        loader fabric_loader
        accessWidener file("../common/src/main/resources/unified.accesswidener")
    }
}

processResources {
    from project(":common").sourceSets.main.resources
    def buildProps = project.properties.clone()

    filesMatching(['fabric.mod.json']) {
        expand buildProps
    }
}

compileTestJava.enabled = false

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}